system:
    Restart:
        LoadRestart: False
        LoadFile: False
        WriteRestart: False
potential:
    species:
        - Fe
        - He
    masses:
        - 1, 55.847
        - 2, 4.001
    bondlengths:
        - 1, 1, 3.106
        - 1, 2, 3.0
        - 2, 2, 3.0
    coordnums:
        - 1, 14
        - 2, 1
    pair_style: "hybrid/overlay eam/fs eam/fs"
    FileName: False
    Path2Pot: False
    pair_coeff:
       - "* * eam/fs 1 FeHe-D.eam.fs Fe He"
       - "* * eam/fs 2 FeHe-S.eam.fs Fe He"
force_evaluator:
    Bin: pylammps
    Path2Bin: False
    nproc: auto
    nproc4ReCal: auto
    Master_Slave4ReCal: False
data:
    atom_style: atomic
    FileName: in.dat
    MoleDyn: True
    BoxRelax: False
    Relaxed: False
kinetic_MC:
    NSteps: 1
    Temp: 800.0
    AccStyle: NoAcc
    DispStyle: SP
    NMaxBasin: 20
saddle_point:
    BarrierCut: 10.0
    Prefactor: 1.0
    BarrierMin: 0.0
    DmagCut: NA
    DmagMin: 0.0
    ValidSPs:
        CheckConnectivity: True
active_volume:
    Style: defects
    NPredef: 0
    PredefOnly: False
    PDReduction: True
    DCut4PDR: 7.5
    RecursiveRed: False
    FindDefects:
        Method: custom
        Defects:
            - 28.55, 28.55, 28.55
    DActive: 11
    DBuffer: 1.0
    DFixed: 10
    Overlapping: True
    DCut4noOverlap: 14.0
spsearch:
    NSearch: 16
    SearchBuffer: False
    NMax4Trans: 500
    TrialStepsize: 0.015
    MaxStepsize: 0.05
    HandleVN:
        CenterVN: True
        RescaleVN: True
        RescaleValue: LOGN
    Master_Slave: True
    AdaptiveDimerSep: False
    NBase4ADS: 500
    DimerSep: 0.02
    DimerSepCap: 0.1
    TransHorizon: True
    En4TransHorizon: 100.0
    DecaySteps: 20
    DecayStyle: Fixed
    CheckAng: True
    CheckAngSteps: 20
    ShowIterationResults: True
    Inteval4ShowIterationResults: 10
    ShowVN4ShowIterationResults: False
    ShowCoords4ShowIterationResults: True
    LocalRelax:
        LocalRelax: True
        InitTemp4Opt: 0.0
        TargetTemp4NVT: 5.0
        NVTSteps4Opt: 100 
    force_evaluator:
        nproc: 1
visual:
    Screen: True
    Log: True
    logfile: "Seakmc.log"
    Write_AV_SPs:
        Write_Local_AV: True    
